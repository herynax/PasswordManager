[package]
name = "passman"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Local, offline-first encrypted password manager for Linux"
license = "MIT"

[lib]
name = "passman"
path = "src/lib.rs"

[[bin]]
name = "passman"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
thiserror = "2"
getrandom = "0.2"
libc = "0.2"

[dev-dependencies]
proptest = "1"